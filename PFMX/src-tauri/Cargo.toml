[package]
name = "pfmx"
version = "0.1.0"
description = "PFMX: finanse osobiste (konta, budżet, płatności cykliczne, import z banku)"
edition = "2021"

[lib]
name = "pfmx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
csv = "1.4.0"
calamine = "0.38"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }
