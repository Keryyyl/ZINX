[package]
name = "cthx"
version = "0.1.0"
description = "Kalendarz, lista zadań i habit tracker"
edition = "2021"

[lib]
name = "cthx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
block2 = "0.6.2"
objc2 = "0.6.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-contacts = { version = "0.3", features = ["CNContactStore", "CNContact", "CNContactFetchRequest", "block2", "std"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSError", "NSEnumerator", "NSObject", "NSCalendar", "NSDate"] }
